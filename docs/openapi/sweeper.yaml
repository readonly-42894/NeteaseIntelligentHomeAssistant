openapi: 3.0.3
info:
  title: 网易智造 App API
  version: 5.3.5
  description: 从 网易智造_5.3.5.apk 反编译提取（Retrofit + OkHttp + Gson）。基础 URL 线上为 https://3c.163.com，认证基于 Cookie（ONE_TOKEN/ONE_TOKEN_ID/UA-INFO）。统一响应结构 ResponseWrapper：code=0 成功，result 为业务数据。登录相关端点（tag=login）走网易 URS SDK（https://sdk.reg.163.com），其响应结构与 ResponseWrapper 不同，见各端点说明。 本文件仅含 sweeper（扫地机器人）模块。
servers:
- url: https://3c.163.com
  description: 线上/Release
- url: https://t2.3c.163.com
  description: Alpha/Beta
- url: https://t.3c.163.com
  description: Develop
tags:
- name: sweeper
  description: 扫地机器人
paths:
  /ai-app/sweeper/rv03/clean-scheme:
    post:
      tags:
      - sweeper
      summary: 新增清扫方案
      operationId: addCleanScheme
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanScheme'
    delete:
      tags:
      - sweeper
      summary: 删除清扫方案
      operationId: deleteCleanScheme
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper'
      parameters:
      - name: equipId
        in: query
        required: true
        schema:
          type: string
        description: 设备ID
      - name: cleanSchemeId
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: 清扫方案ID
      - name: mapId
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: 地图ID
    get:
      tags:
      - sweeper
      summary: 查询清扫方案
      operationId: getCleanScheme
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper_CleanSchemeRsp'
      parameters:
      - name: equipId
        in: query
        required: true
        schema:
          type: string
        description: 设备ID
      - name: mapId
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: 地图ID
