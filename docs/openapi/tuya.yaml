openapi: 3.0.3
info:
  title: 网易智造 App API
  version: 5.3.5
  description: 从 网易智造_5.3.5.apk 反编译提取（Retrofit + OkHttp + Gson）。基础 URL 线上为 https://3c.163.com，认证基于 Cookie（ONE_TOKEN/ONE_TOKEN_ID/UA-INFO）。统一响应结构 ResponseWrapper：code=0 成功，result 为业务数据。登录相关端点（tag=login）走网易 URS SDK（https://sdk.reg.163.com），其响应结构与 ResponseWrapper 不同，见各端点说明。 本文件仅含 tuya（涂鸦 Hybrid）模块。
servers:
- url: https://3c.163.com
  description: 线上/Release
- url: https://t2.3c.163.com
  description: Alpha/Beta
- url: https://t.3c.163.com
  description: Develop
tags:
- name: tuya
  description: 涂鸦 Hybrid
paths:
  /ai-app/user/tuya/info:
    get:
      tags:
      - tuya
      summary: 涂鸦用户信息
      operationId: tuyaUserInfo
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper_TuyaUserInfo'
  /ai-app/user/tuya/log:
    post:
      tags:
      - tuya
      summary: 涂鸦日志上报
      operationId: tuyaUserLog
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                errorCode:
                  type: string
                  description: 错误码
                errorMsg:
                  type: string
                  description: 错误信息
  /ai-app/user/tuya/homeId:
    post:
      tags:
      - tuya
      summary: 上传涂鸦homeId
      operationId: uploadTuyaHomeId
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                homeId:
                  type: integer
                  format: int64
                  description: homeId
              required:
              - homeId
components:
  schemas:
    FlyAlertItem:
      type: object
      properties:
        isCloseOuterWhenClick:
          type: boolean
        isCloseWhenCancel:
          type: boolean
        isCloseWhenSubmit:
          type: boolean
        isShowClose:
          type: boolean
        alertContent:
          type: string
        alertContentAlign:
          type: integer
        cancelTextColor:
          type: integer
        alertCode:
          type: integer
        okCountDown:
          type: integer
        okTextColor:
          type: integer
        permissions:
          type: array
          items:
            type: string
        statistics: {}
        alertImageUrl:
          type: string
        alertTitle:
          type: string
        cancelStatisticsKey:
          type: string
        cancelText:
          type: string
        cancelUrl:
          type: string
        closeStatisticsKey:
          type: string
        okStatisticsKey:
          type: string
        okText:
          type: string
        okUrl:
          type: string
        pageUrl:
          type: string
        showStatisticsKey:
          type: string
        successUrl:
          type: string
    ResponseWrapper:
      type: object
      properties:
        code:
          type: integer
        errorMsg:
          type: string
        result: {}
        showType:
          type: integer
        alertInfo:
          $ref: '#/components/schemas/FlyAlertItem'
        rawResult: {}
    ResponseWrapper_TuyaUserInfo:
      type: object
      properties:
        code:
          type: integer
        errorMsg:
          type: string
        result:
          $ref: '#/components/schemas/TuyaUserInfo'
        showType:
          type: integer
        alertInfo:
          $ref: '#/components/schemas/FlyAlertItem'
        rawResult: {}
    TuyaUserInfo:
      type: object
      properties:
        tuyaHomeId:
          type: integer
          format: int64
        tuyaTk:
          type: string
