openapi: 3.0.3
info:
  title: 网易智造 App API
  version: 5.3.5
  description: 从 网易智造_5.3.5.apk 反编译提取（Retrofit + OkHttp + Gson）。基础 URL 线上为 https://3c.163.com，认证基于 Cookie（ONE_TOKEN/ONE_TOKEN_ID/UA-INFO）。统一响应结构 ResponseWrapper：code=0 成功，result 为业务数据。登录相关端点（tag=login）走网易 URS SDK（https://sdk.reg.163.com），其响应结构与 ResponseWrapper 不同，见各端点说明。 本文件仅含 firmware（固件 OTA）模块。
servers:
- url: https://3c.163.com
  description: 线上/Release
- url: https://t2.3c.163.com
  description: Alpha/Beta
- url: https://t.3c.163.com
  description: Develop
tags:
- name: firmware
  description: 固件 OTA
paths:
  /ai-app/ota/status:
    get:
      tags:
      - firmware
      summary: OTA状态
      operationId: checkOtaStatus
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper_OtaResponse'
      parameters:
      - name: productId
        in: query
        required: true
        schema:
          type: integer
        description: 产品ID
      - name: sn
        in: query
        required: true
        schema:
          type: string
        description: 序列号
  /ai-app/ota/check:
    get:
      tags:
      - firmware
      summary: 检查更新
      operationId: checkUpdate
      responses:
        '200':
          description: 成功（code=0 表示成功，见 ResponseWrapper）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper_CheckUpdateResponse'
      parameters:
      - name: productId
        in: query
        required: true
        schema:
          type: integer
        description: 产品ID
      - name: version
        in: query
        required: true
        schema:
          type: string
        description: 版本
      - name: type
        in: query
        required: true
        schema:
          type: string
        description: 类型
      - name: sn
        in: query
        required: true
        schema:
          type: string
        description: 序列号
components:
  schemas:
    CheckUpdateReport:
      type: object
      properties:
        releaseTime:
          type: integer
          format: int64
        totalLength:
          type: integer
          format: int64
        version:
          type: string
        information:
          type: string
        url:
          type: string
        sign:
          type: string
    CheckUpdateResponse:
      type: object
      properties:
        isLatest:
          type: boolean
        report:
          $ref: '#/components/schemas/CheckUpdateReport'
        releaseTime:
          type: integer
          format: int64
        totalLength:
          type: integer
          format: int64
        information:
          type: string
        message:
          type: string
        sign:
          type: string
        title:
          type: string
        url:
          type: string
        version:
          type: string
    FlyAlertItem:
      type: object
      properties:
        isCloseOuterWhenClick:
          type: boolean
        isCloseWhenCancel:
          type: boolean
        isCloseWhenSubmit:
          type: boolean
        isShowClose:
          type: boolean
        alertContent:
          type: string
        alertContentAlign:
          type: integer
        cancelTextColor:
          type: integer
        alertCode:
          type: integer
        okCountDown:
          type: integer
        okTextColor:
          type: integer
        permissions:
          type: array
          items:
            type: string
        statistics: {}
        alertImageUrl:
          type: string
        alertTitle:
          type: string
        cancelStatisticsKey:
          type: string
        cancelText:
          type: string
        cancelUrl:
          type: string
        closeStatisticsKey:
          type: string
        okStatisticsKey:
          type: string
        okText:
          type: string
        okUrl:
          type: string
        pageUrl:
          type: string
        showStatisticsKey:
          type: string
        successUrl:
          type: string
    OtaResponse:
      type: object
      properties:
        mcuStatus:
          type: integer
    ResponseWrapper_CheckUpdateResponse:
      type: object
      properties:
        code:
          type: integer
        errorMsg:
          type: string
        result:
          $ref: '#/components/schemas/CheckUpdateResponse'
        showType:
          type: integer
        alertInfo:
          $ref: '#/components/schemas/FlyAlertItem'
        rawResult: {}
    ResponseWrapper_OtaResponse:
      type: object
      properties:
        code:
          type: integer
        errorMsg:
          type: string
        result:
          $ref: '#/components/schemas/OtaResponse'
        showType:
          type: integer
        alertInfo:
          $ref: '#/components/schemas/FlyAlertItem'
        rawResult: {}
