          type: integer
        account:
          type: integer
          format: int64
        createTime:
          type: integer
          format: int64
        familyId:
          type: integer
          format: int64
        lastEndTime:
          type: integer
          format: int64
        lastStartTime:
          type: integer
          format: int64
        rid:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        updateTime:
          type: integer
          format: int64
        alias:
          type: string
        bluetoothMacAddr:
          type: string
        continued:
          type: string
        dialogOks:
          type: string
        manufactorId:
          type: string
        model:
          type: string
        name:
          type: string
        roomName:
          type: string
        sn:
          type: string
        type:
          type: string
        wapUrl:
          type: string
        wifiMacAddr:
          type: string
        isDeleted:
          type: boolean
    EquipData:
      type: object
      properties:
        sync:
          type: boolean
