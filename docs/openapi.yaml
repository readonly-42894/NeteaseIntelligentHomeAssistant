      type: object
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
    UrsTokenResponse:
      type: object
      properties:
        retCode:
          type: integer
        result:
          type: string
        retDesc:
          type: string
    UrsInitResponse:
      type: object
      description: URS 初始化响应。result 为字符串码（201 成功）；msg 为 AES 密文（用临时密钥解密得 {id,key,sign}）；rk 为 RSA 密文（用客户端私钥解密得临时 AES 密钥）。
      properties:
        result:
          type: string
        msg:
          type: string
        rk:
          type: string
    UrsJsonResponse:
      type: object
      description: URS JSON 响应。result 为字符串码（201 成功）；msg 为 AES 密文（登录成功时为 token/ssn/ydAccount 等字段的 URL query）。
      properties:
        result:
          type: string
        msg:
          type: string
