          type: boolean
        isShowClose:
          type: boolean
        alertContent:
          type: string
        alertContentAlign:
          type: integer
        cancelTextColor:
          type: integer
        alertCode:
          type: integer
        okCountDown:
          type: integer
        okTextColor:
          type: integer
        permissions:
          type: array
          items:
            type: string
        statistics: {}
        alertImageUrl:
          type: string
        alertTitle:
          type: string
        cancelStatisticsKey:
          type: string
        cancelText:
          type: string
        cancelUrl:
          type: string
        closeStatisticsKey:
          type: string
        okStatisticsKey:
          type: string
        okText:
          type: string
        okUrl:
          type: string
        pageUrl:
          type: string
        showStatisticsKey:
          type: string
        successUrl:
          type: string
