openapi: 3.0.3
info:
  title: 网易智造 App API
  version: 5.3.5
  description: 从 网易智造_5.3.5.apk 反编译提取（Retrofit + OkHttp + Gson）。基础 URL 线上为 https://3c.163.com，认证基于 Cookie（ONE_TOKEN/ONE_TOKEN_ID/UA-INFO）。统一响应结构 ResponseWrapper：code=0 成功，result 为业务数据。登录相关端点（tag=login）走网易 URS SDK（https://sdk.reg.163.com），其响应结构与 ResponseWrapper 不同，见各端点说明。
servers:
- url: https://3c.163.com
  description: 线上/Release
- url: https://t2.3c.163.com
  description: Alpha/Beta
- url: https://t.3c.163.com
  description: Develop
tags:
- name: kernel
  description: 核心业务（设备/家庭/用户/账号/场景/OTA）
- name: sweeper
  description: 扫地机器人
- name: firmware
  description: 固件 OTA
- name: host
  description: 设备分享
- name: tuya
  description: 涂鸦 Hybrid
- name: login
  description: 网易 URS 登录 SDK（短信/密码/邮箱/OAuth）
- name: misc
  description: 其他（头像等）
